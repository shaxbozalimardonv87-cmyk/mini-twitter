services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_twitter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      - mini-twitter-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_twitter"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/mini_twitter
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mini-twitter-data:
